services:
  db:
    image: postgres:16
    container_name: fertrack-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - fertrack_pg:/var/lib/postgresql/data

volumes:
  fertrack_pg: